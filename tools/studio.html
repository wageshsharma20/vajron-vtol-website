<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTOL studio</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{background:radial-gradient(60% 55% at 50% 58%,#2a2a2d 0%,#111113 45%,#000 100%)}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:10px;top:10px;color:#888;font:12px ui-monospace,monospace}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createStage } from '../js/stage.js';
import { buildVTOL } from '../js/vtol.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const S = createStage(canvas, { alpha: true, capture: true, pixelRatio: +(q.get('pr') || 1) });
const vtol = buildVTOL(THREE);
S.scene.add(vtol.group);
vtol.snap(q.get('mode') || 'idle');

const VIEWS = {
  hero:   { pos: [2.35, 0.95, 2.05], tgt: [-0.18, 0.02, 0], fov: 30 },
  front:  { pos: [3.2, 0.25, 0], tgt: [0, 0.03, 0], fov: 28 },
  side:   { pos: [0, 0.1, 3.4], tgt: [-0.25, 0.03, 0], fov: 28 },
  top:    { pos: [-0.25, 4.2, 0.0001], tgt: [-0.25, 0, 0], fov: 30 },
  under:  { pos: [1.3, -0.9, 1.1], tgt: [0.2, -0.05, 0], fov: 30 },
  gimbal: { pos: [0.85, -0.2, 0.42], tgt: [0.29, -0.12, 0], fov: 26 },
  tail:   { pos: [-1.9, 0.75, 1.25], tgt: [-0.85, 0.18, 0], fov: 28 },
  rear:   { pos: [-2.6, 0.6, -1.5], tgt: [-0.3, 0.05, 0], fov: 30 },
};
function setView(name) {
  const v = VIEWS[name] || VIEWS.hero;
  S.camera.fov = v.fov; S.camera.position.set(...v.pos);
  controls.target.set(...v.tgt); S.camera.lookAt(...v.tgt); controls.update();
}
const controls = new OrbitControls(S.camera, canvas);
controls.enableDamping = true;
function fit() { S.resize(canvas.clientWidth, canvas.clientHeight); }
addEventListener('resize', fit); fit();
setView(q.get('view') || 'hero');

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  vtol.update(dt, now / 1000);
  controls.update();
  S.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.studio = { THREE, S, vtol, setView, controls, VIEWS };
document.getElementById('hud').textContent = 'view ' + (q.get('view') || 'hero') + ' · mode ' + (q.get('mode') || 'idle');
</script>
</body>
</html>
